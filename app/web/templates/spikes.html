{% extends "base.html" %}
{% block head_extra %}
{% if embedded %}<style>header{display:none} main{min-height:100vh; padding:16px}</style>{% endif %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/spikes.css') }}">
{% endblock %}
{% block body %}
<div class="page-head">
  <div>
    <h1>Cell {{ neuron.pipeline_neuron_id }} / Spike Detection</h1>
    <p class="subtitle">{{ neuron.canonical_id }}</p>
  </div>
  <div class="toolbar">
    <a class="button secondary" href="/neurons/{{ neuron.id }}{% if embedded %}?embedded=1{% endif %}">Back To Cell</a>
    <button id="save-spikes">Save Edits</button>
  </div>
</div>

<section class="panel">
  <div class="toolbar">
    <button class="secondary" id="zoom-in">Zoom In</button>
    <button class="secondary" id="zoom-out">Zoom Out</button>
    <button class="secondary" id="left">Left</button>
    <button class="secondary" id="right">Right</button>
    <input id="frame-input" type="number" min="0" placeholder="Frame">
    <button class="secondary" id="add-simple" type="button">Add Simple</button>
    <button class="secondary" id="add-complex" type="button">Add Complex</button>
  </div>
  <div class="detector-grid">
    <div class="detector-control">
      <label for="mad-factor">MAD Threshold</label>
      <output id="mad-factor-value"></output>
      <input id="mad-factor" data-detect-param="mad_factor" type="range" min="0.5" max="8" step="0.1">
    </div>
    <div class="detector-control">
      <label for="min-amplitude">Min Amplitude</label>
      <output id="min-amplitude-value"></output>
      <input id="min-amplitude" data-detect-param="min_amplitude" type="range" min="0" max="2" step="0.01">
    </div>
    <div class="detector-control">
      <label for="min-width">Min Width</label>
      <output id="min-width-value"></output>
      <input id="min-width" data-detect-param="min_width" type="range" min="1" max="120" step="1">
    </div>
    <div class="detector-control">
      <label for="min-subthreshold">Min Subthreshold</label>
      <output id="min-subthreshold-value"></output>
      <input id="min-subthreshold" data-detect-param="min_subthreshold" type="range" min="0" max="1" step="0.01">
    </div>
  </div>
  <div class="detector-status">
    <button class="secondary" id="redetect-now">Recalculate</button>
    <button class="secondary" id="reset-detection">Reset Parameters</button>
    <span id="detection-stats" class="chip">Detection Not Loaded</span>
    <span id="detection-status" class="muted"></span>
  </div>
  <canvas id="spike-canvas" class="trace-canvas" style="height:560px; margin-top:12px;"></canvas>
  <div class="toolbar" style="margin-top:12px">
    <span id="selected-info" class="chip">No Spike Selected</span>
    <button class="secondary" data-label="simple">Set Simple</button>
    <button class="secondary" data-label="complex">Set Complex</button>
    <button class="secondary" data-label="exclude">Exclude</button>
    <button class="danger" data-label="delete">Delete</button>
  </div>
  <p id="save-status" class="muted"></p>
</section>

<script type="application/json" id="page-data">{{ {"neuronId": neuron.id, "embedded": embedded}|tojson }}</script>
<script src="{{ url_for('static', filename='js/spike_editor.js') }}"></script>
{% endblock %}
