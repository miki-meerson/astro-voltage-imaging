<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Astro Analysis Pipeline{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/">Astro Analysis Pipeline</a>
    <nav>
      <a href="/">Experiments</a>
      <button class="theme-toggle secondary" type="button">Theme</button>
    </nav>
  </header>
  <main class="app-main">{% block body %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
