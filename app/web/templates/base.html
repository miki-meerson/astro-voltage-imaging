<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  {% block head_extra %}{% endblock %}
  <title>Astro Analysis Pipeline</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1116;
      --surface: #151a21;
      --surface-2: #1b222b;
      --surface-3: #222b36;
      --line: #313b47;
      --line-soft: #26303a;
      --text: #e7edf4;
      --muted: #9aa8b7;
      --faint: #748292;
      --accent: #4aa3ff;
      --accent-2: #37c6a6;
      --danger: #e05260;
      --warning: #e4ad45;
      --ok: #4fc17b;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 14px;
    }

    a { color: #8cc7ff; text-decoration: none; }
    a:hover { color: #c4e2ff; text-decoration: underline; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
      padding: 0 24px;
      background: rgba(15, 19, 25, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    header strong {
      font-size: 16px;
      letter-spacing: 0;
    }

    header nav {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--muted);
    }

    main {
      width: 100%;
      min-height: calc(100vh - 56px);
      padding: 22px 24px 34px;
    }

    h1, h2 {
      margin: 0 0 12px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    h1 { font-size: 24px; font-weight: 650; }
    h2 { font-size: 16px; font-weight: 650; color: #f1f6fb; }

    p { margin: 8px 0; }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }

    .subtitle {
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 16px;
      margin: 16px 0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .form-row {
      display: flex;
      gap: 10px;
      align-items: center;
      width: 100%;
    }

    input, textarea, select {
      width: 100%;
      min-width: 0;
      color: var(--text);
      background: #0f141a;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 10px;
      font: inherit;
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74, 163, 255, 0.16);
    }

    textarea {
      min-height: 76px;
      resize: vertical;
      font-family: Consolas, "Segoe UI Mono", monospace;
      font-size: 13px;
    }

    button, .button {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      border: 0;
      border-radius: 6px;
      padding: 8px 12px;
      color: white;
      background: #2c74bd;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    button:hover, .button:hover { background: #3688da; text-decoration: none; }
    .danger { background: #b43f4b; }
    .danger:hover { background: #d64d5a; }
    .secondary { background: var(--surface-3); color: var(--text); border: 1px solid var(--line); }

    .icon-button {
      width: 36px;
      min-width: 36px;
      padding: 0;
      color: var(--warning);
      background: transparent;
      border: 1px solid transparent;
    }

    .icon-button:hover {
      color: #ffd36a;
      background: rgba(228, 173, 69, 0.12);
      border-color: rgba(228, 173, 69, 0.28);
    }

    .table-wrap {
      width: 100%;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .table-toolbar {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line-soft);
      background: var(--surface-2);
    }

    table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line-soft);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: var(--surface-2);
      color: #c9d5e2;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
      white-space: nowrap;
    }

    tr:hover td { background: rgba(255, 255, 255, 0.025); }
    tr:last-child td { border-bottom: 0; }

    .muted { color: var(--muted); }
    .path { color: var(--faint); overflow-wrap: anywhere; font-family: Consolas, "Segoe UI Mono", monospace; font-size: 12px; }

    code, pre {
      color: #d8e6f5;
      background: #0c1015;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
    }

    code { padding: 2px 5px; }

    pre {
      max-height: 360px;
      overflow: auto;
      padding: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: Consolas, "Segoe UI Mono", monospace;
      font-size: 12px;
      line-height: 1.45;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 3px 9px;
      background: var(--surface-3);
      border: 1px solid var(--line);
      color: #cbd6e2;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }

    .valid, .completed { color: var(--ok); }
    .failed { color: var(--danger); }
    .running, .pending { color: var(--warning); }
    .cancelled, .blocked { color: var(--muted); }

    .run-form {
      display: grid;
      grid-template-columns: 150px 120px minmax(220px, 1fr) auto;
      gap: 10px;
      align-items: start;
      padding: 10px 0;
      border-top: 1px solid var(--line-soft);
    }

    .run-form:first-of-type { border-top: 0; }
    .run-form > button { grid-column: -2 / -1; }
    .check { display: flex; align-items: center; gap: 8px; min-height: 36px; color: var(--muted); }
    .check input { width: auto; }

    .checkbox-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      min-height: 36px;
    }

    .decision-stack {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      min-width: 260px;
    }

    .decision-stack form { display: contents; }

    .progress {
      width: min(240px, 100%);
      height: 8px;
      overflow: hidden;
      background: #0b0f14;
      border: 1px solid var(--line-soft);
      border-radius: 999px;
    }

    .progress > span {
      display: block;
      height: 100%;
      width: var(--value);
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: inherit;
    }

    .progress.running > span {
      width: 45%;
      animation: pulsebar 1.4s ease-in-out infinite alternate;
    }

    @keyframes pulsebar {
      from { transform: translateX(-35%); }
      to { transform: translateX(135%); }
    }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }

    .tile {
      display: block;
      min-height: 68px;
      padding: 12px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
    }

    .tile:hover {
      background: var(--surface-3);
      text-decoration: none;
    }

    .artifact-list {
      display: grid;
      gap: 8px;
    }

    .artifact {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px;
      background: #0f141a;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
    }

    .analysis-image {
      display: block;
      width: 100%;
      object-fit: contain;
      background: #0b0f14;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
    }

    .trace-canvas {
      display: block;
      width: 100%;
      background: #0b0f14;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
    }

    .compact-stats {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .behavior-legend {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 4px 0 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .behavior-legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-fill,
    .legend-line {
      display: inline-block;
      width: 26px;
      height: 10px;
      border-radius: 3px;
      border: 1px solid var(--line);
    }

    .legend-fill.active { background: rgba(55, 198, 166, 0.42); }
    .legend-fill.inactive { background: rgba(74, 163, 255, 0.38); }
    .legend-fill.unlabeled { background: rgba(228, 173, 69, 0.34); }
    .legend-line.velocity {
      height: 0;
      border: 0;
      border-top: 3px solid #f1f6fb;
      border-radius: 0;
    }
    .legend-line.threshold {
      height: 0;
      border: 0;
      border-top: 2px dashed var(--warning);
      border-radius: 0;
    }

    .confirm-form {
      display: grid;
      grid-template-columns: minmax(180px, 320px) auto;
      gap: 8px;
      align-items: center;
    }

    @media (max-width: 900px) {
      main { padding: 16px; }
      .grid, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .page-head { display: block; }
      .run-form { grid-template-columns: 1fr; }
      .confirm-form { grid-template-columns: 1fr; margin-top: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <strong>Astro Analysis Pipeline</strong>
    <nav>
      <a href="/">Experiments</a>
    </nav>
  </header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
