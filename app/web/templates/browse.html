{% extends "base.html" %}
{% block body %}
<div class="page-head">
  <div>
    <h1>Browse folders</h1>
    <p class="path">{{ current }}</p>
  </div>
  <form method="post" action="/experiments/add">
    <input type="hidden" name="path" value="{{ current }}">
    <button>Use this folder</button>
  </form>
</div>

<section class="panel">
  <div class="stats">
    {% if parent %}
    <a class="stat" href="/browse?path={{ parent|urlencode }}"><div class="value">..</div><div class="label">up one folder</div></a>
    {% endif %}
    {% for d in dirs %}
    <a class="stat" href="/browse?path={{ d|urlencode }}"><b>{{ d.name }}</b><div class="path">{{ d }}</div></a>
    {% endfor %}
  </div>
</section>
{% endblock %}
