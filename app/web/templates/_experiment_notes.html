<section class="panel" id="experiment-notes">
  <div class="panel-head">
    <div>
      <h2>Notes</h2>
      <p class="muted">{{ notes|length }} saved note(s).</p>
    </div>
  </div>
  <form method="post" action="/experiments/{{ exp.id }}/notes" class="stack">
    <input type="hidden" name="next" value="{{ request.path }}#experiment-notes">
    <textarea name="note_text" placeholder="Write a note about this experiment..." maxlength="10000" required></textarea>
    <div><button type="submit">Save note</button></div>
  </form>
  {% for note in notes %}
  <article class="callout">
    <div class="panel-head">
      <span class="chip">{{ note.created_at }}</span>
      <form method="post" action="/experiments/{{ exp.id }}/notes/{{ note.id }}/delete" onsubmit="return confirm('Delete this note?');">
        <input type="hidden" name="next" value="{{ request.path }}#experiment-notes">
        <button class="danger small" type="submit">Delete</button>
      </form>
    </div>
    <p style="white-space:pre-wrap;overflow-wrap:anywhere">{{ note.note_text }}</p>
  </article>
  {% endfor %}
</section>
